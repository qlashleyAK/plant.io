name: plantio

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: pio-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  minio:
    image: minio/minio:latest
    container_name: pio-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9090:9090"
    environment:
      MINIO_ROOT_USER: plantio
      MINIO_ROOT_PASSWORD: REDACTED_MINIO_PASSWORD
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9090"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  nodered:
    build: ./nodered
    image: plantio-nodered:latest
    container_name: pio-nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - ./nodered/data:/data
    environment:
      - TZ=America/Chicago
    depends_on:
      - mosquitto
    privileged: true

  api:
    build: ./api
    image: plantio-api:latest
    container_name: pio-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
    environment:
      - MQTT_BROKER=mqtt://mosquitto:1883
      - DATABASE_PATH=/app/data/plantio.db
      - PORT=3001
      - ACCESS_KEY=REDACTED_ACCESS_KEY
      - SESSION_SECRET=REDACTED_SESSION_SECRET
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=plantio
      - S3_SECRET_KEY=REDACTED_MINIO_PASSWORD
      - S3_BUCKET=plantio-media
      - S3_REGION=us-east-1
      - OLLAMA_HOST=http://192.168.40.199:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma3:27b-abliterated-vision}
      - OLLAMA_TEXT_MODEL=${OLLAMA_TEXT_MODEL:-gpt-oss:20b-heretic-ara-v3}
      - VAPID_PUBLIC_KEY=REDACTED_VAPID_PUBLIC_KEY
      - VAPID_PRIVATE_KEY=REDACTED_VAPID_PRIVATE_KEY
      - VAPID_SUBJECT=mailto:qlashley@plantio.net
    depends_on:
      - mosquitto
      - minio

  capture:
    build: ./capture
    image: plantio-capture:latest
    container_name: pio-capture
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - API_URL=http://api:3001
      - MQTT_BROKER=mqtt://mosquitto:1883
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=plantio
      - S3_SECRET_KEY=REDACTED_MINIO_PASSWORD
      - S3_BUCKET=plantio-media
      - S3_REGION=us-east-1
      - DATABASE_PATH=/app/data/plantio.db
    depends_on:
      - api
      - minio
      - mosquitto

  web:
    build: ./web
    image: plantio-web:latest
    container_name: pio-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
      - mosquitto

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pio-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token eyJhIjoiNjczMTRhYmQ3ZDkzMjA1OTVjMjlkM2UyODZmMjNmNmIiLCJ0IjoiY2ZmZDQwMzItYjdkMC00Y2I4LWEyMjMtYjlkMWVkZTQzZjY0IiwicyI6Ik1EWTBNREk0TURBdE5UTTBNeTAwWXpObExUZ3dNRGN0WmpBNU0yTXlZMkUyTUdObSJ9
    depends_on:
      - web

volumes:
  minio-data:
