<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>plant.io — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #030712;
      color: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: rgba(17, 24, 39, 0.8);
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .logo {
      width: 48px; height: 48px;
      background: rgba(16, 185, 129, 0.15);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
    }
    .logo svg { color: #34d399; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #6b7280; margin-bottom: 28px; }
    input {
      width: 100%;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      color: #f3f4f6;
      outline: none;
      margin-bottom: 12px;
      text-align: center;
      letter-spacing: 1px;
    }
    input:focus { border-color: #10b981; }
    input::placeholder { color: #4b5563; letter-spacing: 0; }
    button {
      width: 100%;
      background: #059669;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      font-weight: 500;
      color: white;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #047857; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .err {
      color: #f87171;
      font-size: 13px;
      margin-top: 12px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.9C15.5 4.9 17 3.5 19 1c1 2 2 4.18 2 8 0 5.5-4.78 11-10 11Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
    </div>
    <h1>plant.io</h1>
    <p class="sub">Enter your access key to continue</p>
    <form id="f">
      <input id="k" type="text" placeholder="access-key" autocomplete="off" autofocus />
      <button type="submit">Sign In</button>
    </form>
    <div class="err" id="e"></div>
  </div>
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const key = document.getElementById('k').value.trim();
      const err = document.getElementById('e');
      if (!key) return;
      err.textContent = '';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ key }),
        });
        if (res.ok) {
          window.location.href = '/';
        } else {
          err.textContent = 'Invalid access key';
        }
      } catch {
        err.textContent = 'Connection error';
      }
    });
  </script>
</body>
</html>
